<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AhaSpace — Docs</title>
<style>
  :root {
    --paper: #EEF0F2; --ink: #1B2430; --ink-dim: #4B5563; --border: #D7DBDE; --inverse: #2F6A8C;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, ui-serif, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12161B; --ink: #E4E7EA; --ink-dim: #9AA4AE; --border: #2B333B; --inverse: #74AACD; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-serif); padding: 48px 20px; }
  .page { max-width: 640px; margin: 0 auto; }
  h1 { font-family: var(--font-mono); font-size: 22px; font-weight: 600; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--border); }
  li:last-child { border-bottom: 1px solid var(--border); }
  a { display: block; padding: 14px 4px; color: var(--inverse); text-decoration: none; font-family: var(--font-mono); font-size: 14.5px; }
  a:hover { text-decoration: underline; }
</style>
</head>

  </ul>
</div>
</body>
</html>
