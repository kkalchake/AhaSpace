spring:
  application:
    name: Enlightenment
  datasource:
    url: jdbc:h2:mem:learning_db
    driver-class-name: org.h2.Driver
    username:
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}